<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Polaroids</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Nunito+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="app.css">
<style>
.head { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.head h1 { font: 600 2.4rem/1 var(--hand); margin: 0; }
.head p { margin: 4px 0 0; color: var(--muted); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 28px 24px; }
.card { display: grid; gap: 10px; align-content: start; min-width: 0; }
.card a.thumb { display: block; }
.card img {
  width: 100%;
  max-width: 100%;
  aspect-ratio: 1080 / 1313;
  object-fit: cover;
  display: block;
  background: #fbfaf6;
  box-shadow: 0 1px 3px var(--shadow), 0 10px 24px var(--shadow);
  transition: transform .15s;
}
.card:nth-child(odd) img { transform: rotate(-1.2deg); }
.card:nth-child(even) img { transform: rotate(1deg); }
.card a.thumb:hover img { transform: rotate(0) scale(1.02); }
.meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.chip {
  font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
  padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted);
}
.chip.shared { border-color: var(--ok); color: var(--ok); }
.caption { font-weight: 600; overflow-wrap: anywhere; margin: 0; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; }
.actions .btn { padding: 6px 10px; font-size: 13px; }

.empty {
  border: 1px dashed var(--muted);
  border-radius: 10px;
  padding: 40px 20px;
  text-align: center;
  display: grid;
  gap: 12px;
  justify-items: center;
}
.empty h2 { font: 600 2rem/1 var(--hand); margin: 0; }
.empty p { margin: 0; color: var(--muted); max-width: 44ch; }
@media (prefers-reduced-motion: reduce) { .card img { transition: none; } }
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html">Polaroid Maker</a>
  <nav>
    <a class="navlink" href="index.html" aria-current="page">My polaroids</a>
    <a class="navlink" href="editor.html">New polaroid</a>
    <span class="who" id="who"></span>
    <button type="button" class="btn" id="logout">Log out</button>
  </nav>
</header>

<main class="wrap">
  <div class="head">
    <div>
      <h1>My polaroids</h1>
      <p id="count">Loading your polaroids…</p>
    </div>
    <a class="btn primary" href="editor.html">New polaroid</a>
  </div>
  <p class="msg error" id="error" role="alert" hidden></p>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>
    <h2>No polaroids yet</h2>
    <p>Make your first one: upload a photo, write a caption, and click Save. It will show up here so you can edit or share it.</p>
    <a class="btn primary" href="editor.html">Make a polaroid</a>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
const { sb } = App;
const $ = (id) => document.getElementById(id);
let rows = [];

function showError(text) { $('error').textContent = text; $('error').hidden = !text; }

async function load() {
  await App.requireUser();
  const { data, error } = await sb.from('polaroids')
    .select('id, caption, render_path, photo_path, share_token, updated_at')
    .order('updated_at', { ascending: false });
  if (error) { $('count').textContent = ''; return showError(App.friendlyError(error)); }
  rows = data;

  const paths = rows.map((r) => r.render_path).filter(Boolean);
  const urls = {};
  if (paths.length) {
    const { data: signed } = await sb.storage.from('photos').createSignedUrls(paths, 3600);
    (signed || []).forEach((s) => { if (s.signedUrl) urls[s.path] = s.signedUrl; });
  }
  render(urls);
}

function render(urls) {
  const grid = $('grid');
  grid.textContent = '';
  $('empty').hidden = rows.length > 0;
  $('count').textContent = rows.length === 1 ? '1 polaroid' : `${rows.length} polaroids`;

  rows.forEach((row) => {
    const card = document.createElement('article');
    card.className = 'card';

    const link = document.createElement('a');
    link.className = 'thumb';
    link.href = 'editor.html?id=' + row.id;
    link.title = 'Edit this polaroid';
    const img = document.createElement('img');
    img.alt = row.caption ? `Polaroid: ${row.caption}` : 'Polaroid';
    img.loading = 'lazy';
    if (urls[row.render_path]) img.src = urls[row.render_path];
    link.appendChild(img);

    const caption = document.createElement('p');
    caption.className = 'caption';
    caption.textContent = row.caption || 'No caption';

    const meta = document.createElement('div');
    meta.className = 'meta';
    const when = document.createElement('span');
    when.textContent = 'Edited ' + new Date(row.updated_at).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
    const chip = document.createElement('span');
    chip.className = 'chip' + (row.share_token ? ' shared' : '');
    chip.textContent = row.share_token ? 'Shared' : 'Private';
    meta.append(chip, when);

    const actions = document.createElement('div');
    actions.className = 'actions';
    const edit = document.createElement('a');
    edit.className = 'btn';
    edit.href = 'editor.html?id=' + row.id;
    edit.textContent = 'Edit';
    actions.appendChild(edit);

    if (row.share_token) {
      const copy = button('Copy link', () => App.copyText(App.shareUrl(row.share_token), copy));
      const stop = button('Stop sharing', () => withBusy(stop, async () => { await App.shareOff(row); render(urls); }));
      actions.append(copy, stop);
    } else {
      const share = button('Share', () => withBusy(share, async () => {
        await App.shareOn(row);
        render(urls);
      }));
      actions.appendChild(share);
    }

    const del = button('Delete', () => withBusy(del, async () => {
      if (!window.confirm(`Delete "${row.caption || 'this polaroid'}"? This can't be undone, and its share link will stop working.`)) return;
      await deletePolaroid(row);
      rows = rows.filter((r) => r.id !== row.id);
      render(urls);
    }));
    del.classList.add('danger');
    actions.appendChild(del);

    card.append(link, caption, meta, actions);
    grid.appendChild(card);
  });
}

function button(label, onClick) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'btn';
  b.textContent = label;
  b.addEventListener('click', onClick);
  return b;
}

async function withBusy(btn, fn) {
  btn.disabled = true;
  showError('');
  try { await fn(); } catch (err) { showError(App.friendlyError(err)); } finally { btn.disabled = false; }
}

async function deletePolaroid(row) {
  if (row.share_token) await sb.storage.from('shared').remove([row.share_token + '.png']);
  const files = [row.photo_path, row.render_path].filter(Boolean);
  if (files.length) await sb.storage.from('photos').remove(files);
  const { error } = await sb.from('polaroids').delete().eq('id', row.id);
  if (error) throw error;
}

if (App.configured) load();
</script>
</body>
</html>
